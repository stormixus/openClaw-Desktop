<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="irisL" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#D4B8FF"/>
      <stop offset="30%" stop-color="#A07AEE"/>
      <stop offset="65%" stop-color="#7252D4"/>
      <stop offset="100%" stop-color="#3D2A8A"/>
    </radialGradient>
    <radialGradient id="irisR" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#D4B8FF"/>
      <stop offset="30%" stop-color="#A07AEE"/>
      <stop offset="65%" stop-color="#7252D4"/>
      <stop offset="100%" stop-color="#3D2A8A"/>
    </radialGradient>
    <radialGradient id="irisGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#E8DBFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8DBFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LEFT EYE -->
  <!-- Eye white -->
  <ellipse cx="47" cy="47" rx="10" ry="11" fill="#FEFEFF"/>
  <!-- Iris outer ring -->
  <ellipse cx="47" cy="48" rx="8" ry="9" fill="url(#irisL)"/>
  <!-- Iris inner pattern ring -->
  <ellipse cx="47" cy="48" rx="5.5" ry="6.2" fill="none" stroke="#9B6EE8" stroke-width="0.4" opacity="0.5"/>
  <!-- Pupil -->
  <ellipse cx="47" cy="47" rx="3.2" ry="3.6" fill="#0E0820"/>
  <!-- Iris light spokes -->
  <path d="M47 42 L46 45" stroke="#C4A8FF" stroke-width="0.3" opacity="0.4"/>
  <path d="M47 42 L48 45" stroke="#C4A8FF" stroke-width="0.3" opacity="0.4"/>
  <path d="M43 46 L45.5 47" stroke="#B89EF5" stroke-width="0.3" opacity="0.3"/>
  <path d="M51 46 L48.5 47" stroke="#B89EF5" stroke-width="0.3" opacity="0.3"/>
  <!-- Bottom iris glow -->
  <ellipse cx="47" cy="51" rx="4" ry="3" fill="url(#irisGlow)"/>
  <!-- Main highlight (large, upper-left) -->
  <ellipse cx="43.5" cy="43.5" rx="3" ry="2.8" fill="#FFFFFF" opacity="0.92"/>
  <!-- Secondary highlight (small, lower-right) -->
  <circle cx="50.5" cy="51" r="1.5" fill="#FFFFFF" opacity="0.55"/>
  <!-- Tiny sparkle -->
  <circle cx="45" cy="50" r="0.6" fill="#FFFFFF" opacity="0.4"/>
  <!-- Upper eyelid line (thick, anime-style) -->
  <path d="M37 39 Q42 34 47 35.5 Q52 34 57 39" fill="none" stroke="#1A1430" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Eyelash accents -->
  <line x1="38" y1="38" x2="36" y2="34" stroke="#1A1430" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="41" y1="36" x2="39" y2="33" stroke="#1A1430" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="35" x2="43" y2="33" stroke="#1A1430" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Lower eyelid -->
  <path d="M40 55 Q44 57 47 57 Q50 57 54 55" fill="none" stroke="#3D3060" stroke-width="0.7" opacity="0.45"/>

  <!-- RIGHT EYE -->
  <ellipse cx="73" cy="47" rx="10" ry="11" fill="#FEFEFF"/>
  <ellipse cx="73" cy="48" rx="8" ry="9" fill="url(#irisR)"/>
  <ellipse cx="73" cy="48" rx="5.5" ry="6.2" fill="none" stroke="#9B6EE8" stroke-width="0.4" opacity="0.5"/>
  <ellipse cx="73" cy="47" rx="3.2" ry="3.6" fill="#0E0820"/>
  <path d="M73 42 L72 45" stroke="#C4A8FF" stroke-width="0.3" opacity="0.4"/>
  <path d="M73 42 L74 45" stroke="#C4A8FF" stroke-width="0.3" opacity="0.4"/>
  <path d="M69 46 L71.5 47" stroke="#B89EF5" stroke-width="0.3" opacity="0.3"/>
  <path d="M77 46 L74.5 47" stroke="#B89EF5" stroke-width="0.3" opacity="0.3"/>
  <ellipse cx="73" cy="51" rx="4" ry="3" fill="url(#irisGlow)"/>
  <ellipse cx="69.5" cy="43.5" rx="3" ry="2.8" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="76.5" cy="51" r="1.5" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="71" cy="50" r="0.6" fill="#FFFFFF" opacity="0.4"/>
  <path d="M63 39 Q68 34 73 35.5 Q78 34 83 39" fill="none" stroke="#1A1430" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="82" y1="38" x2="84" y2="34" stroke="#1A1430" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="79" y1="36" x2="81" y2="33" stroke="#1A1430" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="76" y1="35" x2="77" y2="33" stroke="#1A1430" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M66 55 Q70 57 73 57 Q76 57 80 55" fill="none" stroke="#3D3060" stroke-width="0.7" opacity="0.45"/>

  <!-- Eyebrows -->
  <path d="M39 31 Q44 28 52 30.5" fill="none" stroke="#9B6095" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
  <path d="M81 31 Q76 28 68 30.5" fill="none" stroke="#9B6095" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
</svg>
