<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hairBack" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#2A2E48"/>
      <stop offset="40%" stop-color="#181D35"/>
      <stop offset="100%" stop-color="#0D1228"/>
    </linearGradient>
    <linearGradient id="hairFront" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#303654"/>
      <stop offset="45%" stop-color="#1C2240"/>
      <stop offset="100%" stop-color="#10162C"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="35%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#6070A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6070A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E8"/>
      <stop offset="100%" stop-color="#F0D6C2"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E8CCBA"/>
      <stop offset="100%" stop-color="#DFC0AC"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#344068"/>
      <stop offset="55%" stop-color="#222E52"/>
      <stop offset="100%" stop-color="#18203E"/>
    </linearGradient>
    <linearGradient id="blazerShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1A2440"/>
      <stop offset="100%" stop-color="#121A32"/>
    </linearGradient>
    <linearGradient id="trim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7080A8"/>
      <stop offset="50%" stop-color="#B0BCD8"/>
      <stop offset="100%" stop-color="#7080A8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E05898"/>
      <stop offset="100%" stop-color="#B83878"/>
    </linearGradient>
  </defs>

  <!-- Hair back (long, sleek, flowing past shoulders) -->
  <path d="M18 44 Q12 78 10 122 Q10 148 23 158 Q28 160 33 156 L38 53 Z" fill="url(#hairBack)"/>
  <path d="M102 44 Q108 78 110 122 Q110 148 97 158 Q92 160 87 156 L82 53 Z" fill="url(#hairBack)"/>
  <!-- Hair back strand details -->
  <path d="M27 60 Q22 95 19 142" stroke="#404870" stroke-width="0.6" opacity="0.3" fill="none"/>
  <path d="M31 64 Q26 98 24 138" stroke="#404870" stroke-width="0.5" opacity="0.22" fill="none"/>
  <path d="M93 60 Q98 95 101 142" stroke="#404870" stroke-width="0.6" opacity="0.3" fill="none"/>
  <path d="M89 64 Q94 98 96 138" stroke="#404870" stroke-width="0.5" opacity="0.22" fill="none"/>
  <!-- Hair back blue sheen -->
  <path d="M22 65 Q18 90 16 130" stroke="#5566AA" stroke-width="1.4" opacity="0.15" fill="none"/>
  <path d="M98 65 Q102 90 104 130" stroke="#5566AA" stroke-width="1.4" opacity="0.15" fill="none"/>

  <!-- Blazer body -->
  <path d="M34 88 Q28 100 26 140 Q26 153 40 156 L80 156 Q94 153 94 140 Q92 100 86 88 Z" fill="url(#blazer)"/>
  <!-- Blazer fold lines -->
  <path d="M35 91 Q30 103 29 138" stroke="#121C34" stroke-width="0.8" opacity="0.4" fill="none"/>
  <path d="M85 91 Q90 103 91 138" stroke="#121C34" stroke-width="0.8" opacity="0.4" fill="none"/>
  <path d="M50 114 L70 114 L68 155 L52 155 Z" fill="url(#blazerShadow)" opacity="0.18"/>
  <!-- Blazer pleat lines -->
  <path d="M43 132 L45 156" stroke="#121C34" stroke-width="0.5" opacity="0.25" fill="none"/>
  <path d="M57 130 L57 156" stroke="#121C34" stroke-width="0.4" opacity="0.2" fill="none"/>
  <path d="M63 130 L63 156" stroke="#121C34" stroke-width="0.4" opacity="0.2" fill="none"/>
  <path d="M77 132 L75 156" stroke="#121C34" stroke-width="0.5" opacity="0.25" fill="none"/>

  <!-- Lapels -->
  <path d="M44 89 L54 110 L60 89" fill="none" stroke="url(#trim)" stroke-width="1.5"/>
  <path d="M76 89 L66 110 L60 89" fill="none" stroke="url(#trim)" stroke-width="1.5"/>
  <path d="M43 89 Q50 85 60 84 Q70 85 77 89" fill="none" stroke="url(#trim)" stroke-width="1"/>

  <!-- Shirt collar -->
  <path d="M48 86 L55 101 L60 87" fill="#FFFFFF" stroke="#DDE0EA" stroke-width="0.5"/>
  <path d="M72 86 L65 101 L60 87" fill="#FFFFFF" stroke="#DDE0EA" stroke-width="0.5"/>
  <path d="M55 101 L60 87 L65 101 L62.5 112 L57.5 112 Z" fill="#F8FAFF"/>

  <!-- Ribbon bow -->
  <path d="M53 94 Q49 87 45.5 91 Q47 97 54 97.5 Z" fill="url(#ribbon)"/>
  <path d="M67 94 Q71 87 74.5 91 Q73 97 66 97.5 Z" fill="url(#ribbon)"/>
  <path d="M53 94 Q49.5 88 46.5 91.5" stroke="#F090C0" stroke-width="0.4" opacity="0.45" fill="none"/>
  <path d="M67 94 Q70.5 88 73.5 91.5" stroke="#F090C0" stroke-width="0.4" opacity="0.45" fill="none"/>
  <ellipse cx="60" cy="95.5" rx="2.8" ry="2.3" fill="#B03070"/>
  <ellipse cx="59.3" cy="94.8" rx="0.9" ry="0.6" fill="#D06098" opacity="0.5"/>
  <path d="M58.9 97.6 L58.1 110" stroke="#B03070" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M61.1 97.6 L61.9 110" stroke="#B03070" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="76" width="16" height="14" rx="6" fill="url(#skinTone)"/>
  <ellipse cx="60" cy="86" rx="8" ry="2" fill="#E8CCBA" opacity="0.3"/>

  <!-- Face/head -->
  <ellipse cx="60" cy="44" rx="27" ry="32" fill="url(#skinTone)"/>
  <path d="M36 50 Q40 72 60 78 Q80 72 84 50" fill="url(#skinTone)"/>
  <!-- Face shadow under bangs -->
  <path d="M38 38 Q44 36 60 36 Q76 36 82 38 L82 42 Q76 40 60 40 Q44 40 38 42 Z" fill="url(#skinShadow)" opacity="0.28"/>

  <!-- Front hair - main volume -->
  <path d="M33 44 Q30 18 45 8 Q53 2 60 4 Q67 2 75 8 Q90 18 87 44 Q85 28 77 22 Q69 16 60 19 Q51 16 43 22 Q35 28 33 44 Z" fill="url(#hairFront)"/>
  <!-- Front bangs (separated strands, anime style) -->
  <path d="M36 42 Q40 24 47 25 Q45 35 41 46 Z" fill="url(#hairFront)"/>
  <path d="M43 37 Q48 19 55 22 Q52 31 47 42 Z" fill="url(#hairFront)"/>
  <path d="M52 33 Q57 17 63 21 Q60 30 56 40 Z" fill="url(#hairFront)"/>
  <path d="M61 33 Q65 18 71 23 Q68 32 64 41 Z" fill="url(#hairFront)"/>
  <path d="M69 36 Q73 22 79 27 Q76 35 72 44 Z" fill="url(#hairFront)"/>
  <path d="M76 40 Q80 28 85 34 Q83 40 79 47 Z" fill="url(#hairFront)"/>

  <!-- Side locks (longer, more elegant) -->
  <path d="M34 46 Q25 60 21 78 Q24 77 35 60 Z" fill="url(#hairFront)"/>
  <path d="M86 46 Q95 60 99 78 Q96 77 85 60 Z" fill="url(#hairFront)"/>

  <!-- Hair blue-sheen highlights -->
  <path d="M44 14 Q49 9 54 14" stroke="#6575A0" stroke-width="1.8" opacity="0.28" fill="none" stroke-linecap="round"/>
  <path d="M62 12 Q67 7 72 12" stroke="#6575A0" stroke-width="1.8" opacity="0.28" fill="none" stroke-linecap="round"/>
  <path d="M40 28 Q44 36 42 48" stroke="#5568A0" stroke-width="0.7" opacity="0.22" fill="none"/>
  <path d="M54 22 Q56 32 54 42" stroke="#5568A0" stroke-width="0.7" opacity="0.22" fill="none"/>
  <path d="M66 22 Q64 32 66 42" stroke="#5568A0" stroke-width="0.7" opacity="0.22" fill="none"/>
  <path d="M78 30 Q76 38 78 46" stroke="#5568A0" stroke-width="0.6" opacity="0.18" fill="none"/>

  <!-- Ears -->
  <ellipse cx="34" cy="50" rx="3" ry="5" fill="url(#skinTone)"/>
  <ellipse cx="86" cy="50" rx="3" ry="5" fill="url(#skinTone)"/>
  <ellipse cx="34" cy="50" rx="1.5" ry="3" fill="#F0D6C2" opacity="0.5"/>
  <ellipse cx="86" cy="50" rx="1.5" ry="3" fill="#F0D6C2" opacity="0.5"/>
</svg>
