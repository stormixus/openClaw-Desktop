<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="irisLeft" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#AAB0C0"/>
      <stop offset="30%" stop-color="#7880A0"/>
      <stop offset="65%" stop-color="#4D5570"/>
      <stop offset="100%" stop-color="#252838"/>
