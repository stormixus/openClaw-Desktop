<svg viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B9DC3"/>
      <stop offset="100%" stop-color="#5C6B8A"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D6E5"/>
      <stop offset="100%" stop-color="#8395A7"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="30" y="80" width="60" height="50" rx="12" fill="url(#body)"/>
  <rect x="38" y="88" width="44" height="10" rx="5" fill="#ef4444" opacity="0.35"/>
  <!-- Neck -->
  <rect x="50" y="72" width="20" height="12" rx="4" fill="#8395A7"/>
  <!-- Head -->
  <ellipse cx="60" cy="45" rx="32" ry="30" fill="url(#head)"/>
  <!-- Antenna (alert) -->
  <line x1="60" y1="15" x2="60" y2="6" stroke="#8395A7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="5" r="3.5" fill="#ef4444"/>
  <!-- Angry brows -->
  <line x1="40" y1="35" x2="50" y2="32" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="35" x2="70" y2="32" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes (sharp) -->
  <ellipse cx="47" cy="42" rx="5.5" ry="5" fill="#1a1a2e"/>
  <ellipse cx="73" cy="42" rx="5.5" ry="5" fill="#1a1a2e"/>
  <circle cx="47" cy="42" r="2.5" fill="#ef4444"/>
  <circle cx="73" cy="42" r="2.5" fill="#ef4444"/>
  <!-- Mouth (tight) -->
  <path d="M48 57 L55 54 L65 54 L72 57" stroke="#4a5568" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ears (red) -->
  <rect x="24" y="38" width="6" height="14" rx="3" fill="#ef4444" opacity="0.5"/>
  <rect x="90" y="38" width="6" height="14" rx="3" fill="#ef4444" opacity="0.5"/>
  <!-- Arms (fists) -->
  <rect x="16" y="82" width="12" height="35" rx="6" fill="url(#body)" transform="rotate(10 22 82)"/>
  <rect x="92" y="82" width="12" height="35" rx="6" fill="url(#body)" transform="rotate(-10 98 82)"/>
</svg>
