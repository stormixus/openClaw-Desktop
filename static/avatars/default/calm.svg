<svg viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B9DC3"/>
      <stop offset="100%" stop-color="#5C6B8A"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D6E5"/>
      <stop offset="100%" stop-color="#8395A7"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="30" y="80" width="60" height="50" rx="12" fill="url(#body)"/>
  <rect x="38" y="88" width="44" height="10" rx="5" fill="#14b8a6" opacity="0.25"/>
  <!-- Neck -->
  <rect x="50" y="72" width="20" height="12" rx="4" fill="#8395A7"/>
  <!-- Head -->
  <ellipse cx="60" cy="45" rx="32" ry="30" fill="url(#head)"/>
  <!-- Antenna (gentle) -->
  <path d="M60 15 Q58 7 56 9" stroke="#8395A7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="9" r="3" fill="#14b8a6" opacity="0.6"/>
  <!-- Eyes (half closed, peaceful) -->
  <path d="M41 43 Q47 39 53 43" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M67 43 Q73 39 79 43" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Gentle smile -->
  <path d="M50 55 Q60 61 70 55" stroke="#4a5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Zzz -->
  <text x="92" y="20" font-size="8" fill="#14b8a6" opacity="0.5" font-family="sans-serif" font-weight="bold">z</text>
  <text x="98" y="14" font-size="10" fill="#14b8a6" opacity="0.6" font-family="sans-serif" font-weight="bold">z</text>
  <text x="106" y="7" font-size="12" fill="#14b8a6" opacity="0.7" font-family="sans-serif" font-weight="bold">Z</text>
  <!-- Ears -->
  <rect x="24" y="38" width="6" height="14" rx="3" fill="#14b8a6" opacity="0.4"/>
  <rect x="90" y="38" width="6" height="14" rx="3" fill="#14b8a6" opacity="0.4"/>
  <!-- Arms (relaxed) -->
  <rect x="18" y="87" width="12" height="35" rx="6" fill="url(#body)"/>
  <rect x="90" y="87" width="12" height="35" rx="6" fill="url(#body)"/>
</svg>
