<svg viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B9DC3"/>
      <stop offset="100%" stop-color="#5C6B8A"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D6E5"/>
      <stop offset="100%" stop-color="#8395A7"/>
    </linearGradient>
  </defs>
  <!-- Sparkles -->
  <circle cx="18" cy="20" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="105" cy="25" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <path d="M10 35 L12 30 L14 35 L12 40Z" fill="#fbbf24" opacity="0.5"/>
  <path d="M108 12 L110 8 L112 12 L110 16Z" fill="#fbbf24" opacity="0.5"/>
  <!-- Body -->
  <rect x="30" y="80" width="60" height="50" rx="12" fill="url(#body)"/>
  <rect x="38" y="88" width="44" height="10" rx="5" fill="#fbbf24" opacity="0.3"/>
  <!-- Neck -->
  <rect x="50" y="72" width="20" height="12" rx="4" fill="#8395A7"/>
  <!-- Head -->
  <ellipse cx="60" cy="45" rx="32" ry="30" fill="url(#head)"/>
  <!-- Antenna (bouncing) -->
  <line x1="60" y1="15" x2="60" y2="4" stroke="#8395A7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="3" r="4" fill="#fbbf24"/>
  <!-- Star eyes -->
  <path d="M47 42 L49 38 L51 42 L47 40 L51 40Z" fill="#fbbf24" stroke="#1a1a2e" stroke-width="0.5"/>
  <path d="M73 42 L75 38 L77 42 L73 40 L77 40Z" fill="#fbbf24" stroke="#1a1a2e" stroke-width="0.5"/>
  <circle cx="47" cy="42" r="8" fill="#1a1a2e"/>
  <path d="M47 35 L49 39 L53 39 L50 42 L51 46 L47 44 L43 46 L44 42 L41 39 L45 39Z" fill="#fbbf24"/>
  <circle cx="73" cy="42" r="8" fill="#1a1a2e"/>
  <path d="M73 35 L75 39 L79 39 L76 42 L77 46 L73 44 L69 46 L70 42 L67 39 L71 39Z" fill="#fbbf24"/>
  <!-- Blush -->
  <ellipse cx="37" cy="50" rx="5" ry="3" fill="#f472b6" opacity="0.35"/>
  <ellipse cx="83" cy="50" rx="5" ry="3" fill="#f472b6" opacity="0.35"/>
  <!-- Mouth (big smile) -->
  <path d="M45 54 Q60 68 75 54" stroke="#4a5568" stroke-width="2" fill="#4a5568" opacity="0.5"/>
  <!-- Ears -->
  <rect x="24" y="38" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="90" y="38" width="6" height="14" rx="3" fill="#fbbf24" opacity="0.5"/>
  <!-- Arms (raised high) -->
  <rect x="12" y="72" width="12" height="35" rx="6" fill="url(#body)" transform="rotate(-25 18 72)"/>
  <rect x="96" y="72" width="12" height="35" rx="6" fill="url(#body)" transform="rotate(25 102 72)"/>
</svg>
