<svg viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B9DC3"/>
      <stop offset="100%" stop-color="#5C6B8A"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D6E5"/>
      <stop offset="100%" stop-color="#8395A7"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="30" y="80" width="60" height="50" rx="12" fill="url(#body)"/>
  <rect x="38" y="88" width="44" height="10" rx="5" fill="#a855f7" opacity="0.3"/>
  <!-- Neck -->
  <rect x="50" y="72" width="20" height="12" rx="4" fill="#8395A7"/>
  <!-- Head (slightly tilted) -->
  <ellipse cx="60" cy="45" rx="32" ry="30" fill="url(#head)" transform="rotate(-3 60 45)"/>
  <!-- Antenna -->
  <line x1="58" y1="15" x2="56" y2="6" stroke="#8395A7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="56" cy="5" r="3" fill="#a855f7"/>
  <!-- Thought dots -->
  <circle cx="95" cy="22" r="2" fill="#a855f7" opacity="0.4"/>
  <circle cx="100" cy="15" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="107" cy="8" r="4" fill="#a855f7" opacity="0.6"/>
  <!-- Eyes (one squinting) -->
  <ellipse cx="47" cy="42" rx="5.5" ry="6" fill="#1a1a2e"/>
  <circle cx="48" cy="41" r="2.5" fill="#a855f7"/>
  <path d="M67 42 Q73 39 79 42" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- One brow raised -->
  <path d="M40 33 Q47 30 53 34" stroke="#5C6B8A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Mouth (wavy/thinking) -->
  <path d="M50 56 Q55 53 60 56 Q65 59 70 56" stroke="#4a5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <rect x="24" y="38" width="6" height="14" rx="3" fill="#a855f7" opacity="0.5"/>
  <rect x="90" y="38" width="6" height="14" rx="3" fill="#a855f7" opacity="0.5"/>
  <!-- Arms (one hand to chin) -->
  <rect x="18" y="85" width="12" height="35" rx="6" fill="url(#body)"/>
  <rect x="88" y="75" width="12" height="35" rx="6" fill="url(#body)" transform="rotate(-30 94 75)"/>
</svg>
