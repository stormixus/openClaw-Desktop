<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#CC4444"/>
    </linearGradient>
  </defs>
  <!-- Body (slightly tilted) -->
  <g transform="rotate(-3, 60, 60)">
    <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lg)"/>
    <!-- Left Claw (chin-touch thinking) -->
    <path d="M22 48 C7 45 2 55 7 63 C12 72 22 66 25 57 C27 51 24 48 22 48Z" fill="url(#lg)"/>
    <!-- Right Claw -->
    <path d="M98 45 C113 40 118 50 113 60 C108 70 98 65 93 55 C91 48 95 45 98 45Z" fill="url(#lg)"/>
    <!-- Antenna -->
    <path d="M45 15 Q35 5 30 8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 15 Q85 5 90 8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
    <!-- Thinking Eyes (one closed, one open) -->
    <circle cx="45" cy="35" r="6" fill="#0a0a1a"/>
    <circle cx="46" cy="34" r="2" fill="#00CCFF"/>
    <path d="M69 35 Q75 31 81 35" stroke="#0a0a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Thinking dots -->
    <circle cx="95" cy="22" r="2" fill="#88CCFF" opacity="0.5"/>
    <circle cx="100" cy="15" r="3" fill="#88CCFF" opacity="0.4"/>
    <circle cx="107" cy="8" r="4" fill="#88CCFF" opacity="0.3"/>
    <!-- Flat mouth -->
    <line x1="52" y1="52" x2="68" y2="52" stroke="#0a0a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
